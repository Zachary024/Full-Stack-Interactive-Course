name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: python3 build-content.py          # fails on any authoring error
      - run: node tools/check-challenges.js    # every JS challenge: solution passes, starter fails
      - run: node tools/check-sql.js           # every SQL sandbox and challenge
      - run: cd backend && npm ci && npm test
      - run: python3 build-offline.py
