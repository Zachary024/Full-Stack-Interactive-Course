<a class="skip-link" href="#mainContent">Skip to content</a>
<div class="offline-banner" id="offlineBanner" role="status"><svg class="i"><use href="#i-wifi-off"/></svg> You are offline. Cached lessons, quizzes and notes are still available.</div>

<header class="topbar" id="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><svg class="i"><use href="#i-menu"/></svg></button>
  <a class="brand" href="#home" aria-label="Course home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1d4ed8"/><path d="M13 11l-5 5 5 5M19 11l5 5-5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Full Stack <span class="brand-sub">Development Course</span></span>
  </a>
  <div class="topbar-spacer"></div>
  <div class="search-wrap" role="search">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="searchInput" type="search" placeholder="Search the course" aria-label="Search the course" autocomplete="off" spellcheck="false">
    <span class="kbd" aria-hidden="true">/</span>
    <div id="searchResults" class="search-results" aria-live="polite"></div>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="searchToggle" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
    <button class="icon-btn hidden" id="installBtn" aria-label="Install app" title="Install app"><svg class="i"><use href="#i-download"/></svg></button>
    <button class="icon-btn" id="notesToggle" aria-label="Notes" aria-expanded="false" aria-controls="notesPanel" title="Notes"><svg class="i"><use href="#i-notes"/></svg></button>
    <button class="icon-btn" id="profileBtn" aria-label="Account" title="Account"><svg class="i"><use href="#i-user"/></svg></button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <nav aria-label="Modules"><div id="moduleNav"></div></nav>
    <div class="sidebar-foot">
      <div class="lang-pick"><label for="langSel">Code examples in</label><select id="langSel" class="field"></select></div>
      <a class="row sf-link" href="#progress" aria-label="Overall progress, open details"><span>Overall progress</span><strong id="progressLabel">0%</strong></a>
      <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Overall course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="progressFill"></div></div>
    </div>
  </aside>
  <main class="content" id="mainContent" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim"></div>

<aside class="notes-panel" id="notesPanel" aria-label="Notes">
  <div class="notes-head">
    <h2 id="notesTitle">Notes</h2>
    <button class="icon-btn" id="notesClose" aria-label="Close notes"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <p class="hint">Saved automatically for each lesson.</p>
  <textarea class="field" id="notesTextarea" placeholder="Write your notes here" aria-label="Lesson notes"></textarea>
  <span id="notesStatus" role="status"></span>
</aside>

<button class="hl-pop hidden" id="hlBtn"><svg class="i"><use href="#i-pen"/></svg> Highlight</button>

<button type="button" class="to-top" id="toTop" aria-label="Back to top" title="Back to top" hidden><svg class="i" aria-hidden="true"><use href="#i-arrow-up"/></svg><span class="to-top-label">Top</span></button>

<script src="js/widgets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
