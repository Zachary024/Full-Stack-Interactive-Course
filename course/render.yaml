# Render.com blueprint for PRODUCTION: always-on web service + managed PostgreSQL that does not expire.
# (Free plans sleep after 15 minutes and the free database is deleted after 44 days; see render.demo.yaml.)
services:
  - type: web
    name: fullstack-course
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PGSSL
        value: "true"
      - key: PUBLIC_URL
        sync: false            # enter https://your-domain.com in the dashboard
      - key: DATABASE_URL
        fromDatabase: { name: course-db, property: connectionString }
databases:
  - name: course-db
    plan: basic-256mb
